<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="tus-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10ac84" />
      <stop offset="50%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="tus-inner" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10ac84" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#tus-grad)" filter="url(#glow)"/>
  
  <!-- Universal Accessibility Figure / Layer Symbol -->
  <!-- Head -->
  <circle cx="24" cy="14" r="3.5" fill="url(#tus-inner)" />
  
  <!-- Body & Dynamic Arms -->
  <path d="M15 22.5C18 20.8 30 20.8 33 22.5" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round"/>
  <path d="M24 22V31" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round"/>
  
  <!-- Legs / Stable base -->
  <path d="M24 31L18 39" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round"/>
  <path d="M24 31L30 39" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round"/>
  
  <!-- Accessibility Orbit Rings (representing Universal Web Layer) -->
  <ellipse cx="24" cy="25" rx="15" ry="7" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="2 3" transform="rotate(-15 24 25)"/>
</svg>
